# eFinance application settings

# JWT access token lifetime (minutes)
efinance.token.expire.minutes=15

# Refresh token lifetime (days)
efinance.refresh.expire.days=30

# OTP expiry (minutes)
efinance.otp.expire.minutes=10

# Maximum failed login attempts before account lock
efinance.max.login.attempts=5

# Idempotency records expire after this many hours
efinance.idempotency.expire.hours=24

# Request rate limits (fixed windows, per subject)
efinance.rate.limit.login=20
efinance.rate.limit.login.window.seconds=300
efinance.rate.limit.register=5
efinance.rate.limit.register.window.seconds=3600
efinance.rate.limit.password.reset=5
efinance.rate.limit.password.reset.window.seconds=3600
efinance.rate.limit.mfa=10
efinance.rate.limit.mfa.window.seconds=300
efinance.rate.limit.draft.create=30
efinance.rate.limit.draft.create.window.seconds=3600
efinance.rate.limit.application.submit=10
efinance.rate.limit.application.submit.window.seconds=3600

# Email verification OTP expiry (hours)
efinance.email.verify.expire.hours=24

# Default MFA method for new members
efinance.mfa.default=NONE

# Internal system user for dispatcher calls
efinance.system.userlogin=efinance-system

# Draft expiry (days)
efinance.draft.expire.days=30

# Maximum upload file size (bytes, default 10 MB)
efinance.upload.max.bytes=10485760

# KYC document legal retention period (years)
efinance.kyc.retention.years=7

# Stage-change notification adapter (default keeps an in-application message)
notification.adapter=org.apache.ofbiz.efinance.notification.DefaultNotificationAdapter

# Electronic-signature adapter (default is click-wrap consent)
esignature.adapter=org.apache.ofbiz.efinance.contract.signature.ClickWrapSignatureAdapter

# External signature provider (used when esignature.adapter points to ExternalSignatureAdapter)
esignature.external.endpoint=
esignature.external.apiKey=
esignature.external.timeout.seconds=10

# Direct debit adapter (default: staff registers the bank mandate manually)
directdebit.adapter=org.apache.ofbiz.efinance.payment.ManualDirectDebitAdapter

# Bank transfer destination shown on payment instructions
efinance.payment.bank.name=Sample Bank
efinance.payment.bank.branch=Head Office
efinance.payment.bank.accountType=Ordinary
efinance.payment.bank.accountNumber=1234567
efinance.payment.bank.accountHolder=Sample Finance Co.

# Consent document types required before an application can be submitted
efinance.consent.required=EFCONS_TERMS,EFCONS_PRIVACY,EFCONS_CREDIT

# Short-lived re-authentication token lifetime (minutes)
efinance.reauth.expire.minutes=5

